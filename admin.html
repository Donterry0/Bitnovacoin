<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin Panel — BitNova</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="app" class="active">
  <aside class="sidebar">
    <div class="brand"><div class="logo">BN</div><span>Bit<span class="name-b">Nova</span></span></div>
    <ul class="nav-list">
      <li class="nav-item active"><span class="ic">🛡</span> Admin Panel</li>
    </ul>
    <div class="sidebar-foot"><div class="nav-item" onclick="bnLogout()"><span class="ic">↩</span> Log Out</div></div>
  </aside>
  <div class="main-col">
    <div class="topbar">
      <h1>Admin Panel</h1>
      <div class="topbar-right"><div class="avatar">AD</div></div>
    </div>
    <div class="content">
      <section class="view active">
        <div class="grid grid-4">
          <div class="card"><h3>Total Users</h3><div class="big" id="a-users">0</div></div>
          <div class="card"><h3>Total Deposits</h3><div class="big" id="a-deposits">$0.00</div></div>
          <div class="card"><h3>Total Withdrawals</h3><div class="big" id="a-withdrawals">$0.00</div></div>
          <div class="card"><h3>Trading Volume</h3><div class="big" id="a-volume">$0.00</div></div>
        </div>
        <h2 class="section-title">Users</h2>
        <div class="table-wrap">
          <table><thead><tr><th>Account ID</th><th>Name</th><th>Email</th><th>Balance</th><th style="text-align:right;">Adjust Balance</th></tr></thead><tbody id="adminUsersBody"></tbody></table>
        </div>
        <h2 class="section-title">All Transactions</h2>
        <div class="table-wrap">
          <table><thead><tr><th>ID</th><th>Date</th><th>Type</th><th>Asset</th><th>Amount</th><th>Status</th><th style="text-align:right;">Change Status</th></tr></thead><tbody id="adminTxBody"></tbody></table>
        </div>
      </section>
    </div>
  </div>
</div>
<div id="toastWrap"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/firebase.js"></script>
<script src="assets/app.js"></script>
<script>
function bnLogout() { BN.auth.signOut().then(() => location.href = 'index.html'); }

BN.auth.onAuthStateChanged(async (user) => {
  if (!user) { location.href = 'index.html'; return; }
  const admin = await BN.isAdmin(user.uid);
  if (!admin) {
    bnShowToast('Access denied', 'This account is not an admin.', true);
    setTimeout(() => (location.href = 'dashboard.html'), 1200);
    return;
  }
  BN.db.ref('users').on('value', (snap) => {
    const users = [];
    snap.forEach((child) => users.push({ uid: child.key, ...child.val() }));
    renderAdmin(users);
  });
});

function renderAdmin(users) {
  document.getElementById('a-users').textContent = users.length;
  let totalDep = 0, totalWd = 0, volume = 0;
  const allTx = [];
  users.forEach((u) => {
    totalDep += (u.balance && u.balance.totalDeposits) || 0;
    totalWd += (u.balance && u.balance.totalWithdrawals) || 0;
    Object.entries(u.transactions || {}).forEach(([txKey, t]) => {
      if (t.type === 'Buy' || t.type === 'Sell') volume += t.amount;
      allTx.push({ ...t, id: t.txId || txKey, txKey, ownerUid: u.uid });
    });
  });
  document.getElementById('a-deposits').textContent = bnFmtUSD(totalDep);
  document.getElementById('a-withdrawals').textContent = bnFmtUSD(totalWd);
  document.getElementById('a-volume').textContent = bnFmtUSD(volume);

  document.getElementById('adminUsersBody').innerHTML = users.map((u) => `<tr>
    <td>${bnEscapeHtml(u.profile ? u.profile.acctId : '—')}</td>
    <td>${bnEscapeHtml(u.profile ? u.profile.name : '')}</td>
    <td>${bnEscapeHtml(u.profile ? u.profile.email : '')}</td>
    <td>${bnFmtUSD(u.balance ? u.balance.cash : 0)}</td>
    <td style="text-align:right;"><button class="btn btn-ghost btn-sm" data-adjust-uid="${bnEscapeHtml(u.uid)}">Adjust</button></td>
  </tr>`).join('') || bnEmptyRow(5);

  allTx.sort((a, b) => b.date - a.date);
  document.getElementById('adminTxBody').innerHTML = allTx.slice(0, 50).map((t) => `<tr>
    <td>${bnEscapeHtml(t.id)}</td><td>${bnFmtDate(t.date)}</td><td>${bnEscapeHtml(t.type)}</td><td>${bnEscapeHtml(t.asset)}</td><td>${bnFmtUSD(t.amount)}</td>
    <td><span class="status-tag status-${bnEscapeHtml(t.status)}">${bnEscapeHtml(t.status)}</span></td>
    <td style="text-align:right;">
      <select data-status-uid="${bnEscapeHtml(t.ownerUid)}" data-status-txkey="${bnEscapeHtml(t.txKey)}">
        <option value="">Change...</option>
        <option>Completed</option><option>Pending</option><option>Failed</option>
      </select>
    </td>
  </tr>`).join('') || bnEmptyRow(7);
}

// Event delegation avoids interpolating user/Firebase-controlled values into
// inline event handler attributes.
document.getElementById('adminUsersBody').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-adjust-uid]');
  if (btn) adminAdjustBalance(btn.dataset.adjustUid);
});
document.getElementById('adminTxBody').addEventListener('change', (e) => {
  const sel = e.target.closest('[data-status-uid]');
  if (sel) adminChangeStatus(sel.dataset.statusUid, sel.dataset.statusTxkey, sel.value);
});

async function adminAdjustBalance(uid) {
  const amountStr = prompt("Enter amount to ADD to this user's balance (use a negative number to subtract):", '0');
  if (amountStr === null) return;
  const amount = parseFloat(amountStr);
  if (isNaN(amount)) { bnShowToast('Invalid amount', 'Please enter a valid number.', true); return; }
  const ref = BN.userRef(uid, 'balance/cash');
  const snap = await ref.once('value');
  const current = snap.val() || 0;
  await ref.set(current + amount);
  BN.userRef(uid, 'notifications').push({ title: 'Security notification', body: `An admin adjusted your balance by ${bnFmtUSD(amount)}.`, time: Date.now(), read: false });
  bnShowToast('Balance adjusted', `${amount >= 0 ? '+' : ''}${bnFmtUSD(amount)}`);
}
async function adminChangeStatus(uid, txKey, newStatus) {
  if (!newStatus) return;
  await BN.userRef(uid, `transactions/${txKey}/status`).set(newStatus);
  bnShowToast('Status updated', `Transaction marked as ${newStatus}`);
}
</script>
</body>
</html>
