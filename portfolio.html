<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Portfolio — BitNova</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div id="app" class="active">
  <aside class="sidebar">
    <div class="brand"><div class="logo">BN</div><span>Bit<span class="name-b">Nova</span></span></div>
    <ul class="nav-list" id="sidebarNav"></ul>
    <div class="sidebar-foot"><div class="nav-item" onclick="bnLogout()"><span class="ic">↩</span> Log Out</div></div>
  </aside>
  <div class="main-col">
    <div class="topbar">
      <h1 id="viewTitle">Portfolio</h1>
      <div class="topbar-right">
        <button class="icon-btn" id="notifBtn" title="Notifications">🔔<span class="badge-dot hidden" id="notifBadge">0</span></button>
        <div class="avatar" id="topAvatar" onclick="location.href='profile.html'" title="Profile">U</div>
      </div>
      <div class="dropdown" id="notifDropdown">
        <div class="dropdown-head"><span>Notifications</span><a id="notifClear">Clear all</a></div>
        <div id="notifList"></div>
      </div>
    </div>
    <div class="content">
      <section class="view active">
        <div class="grid grid-3">
          <div class="card"><h3>Total Portfolio Value</h3><div class="big" id="p-total">$0.00</div></div>
          <div class="card"><h3>Available Cash</h3><div class="big" id="p-cash">$0.00</div></div>
          <div class="card"><h3>Total P/L</h3><div class="big" id="p-pl">$0.00</div></div>
        </div>
        <h2 class="section-title">Allocation</h2>
        <div class="card">
          <div class="alloc-bar" id="allocBar"></div>
          <div id="allocLegend" style="display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;"></div>
        </div>
        <h2 class="section-title">Holdings</h2>
        <div class="card" id="holdingsList"></div>
      </section>
    </div>
  </div>
</div>
<nav class="bottom-nav"><ul id="bottomNavList"></ul></nav>
<div id="toastWrap"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/firebase.js"></script>
<script src="assets/app.js"></script>
<script>
bnBuildNav('portfolio');
function bnLogout() { BN.auth.signOut().then(() => location.href = 'index.html'); }
BN.requireAuth(async (user) => {
  await BN.ensureUserRecord(user);
  bnWireNotifications(user.uid);
  BN.userRef(user.uid).on('value', (snap) => {
    const data = snap.val();
    if (!data) return;
    bnApplyTheme(data.settings && data.settings.theme);
    bnSetAvatarInitials(data.profile.name);
    renderPortfolio(data);
  });
});
function renderPortfolio(data) {
  const holdings = data.holdings || {};
  let portfolioVal = 0;
  for (const cid in holdings) {
    const h = holdings[cid];
    const coin = BN_COINS.find((c) => c.id === cid);
    if (coin && h.qty > 0) portfolioVal += h.qty * coin.price;
  }
  document.getElementById('p-total').textContent = bnFmtUSD(portfolioVal + data.balance.cash);
  document.getElementById('p-cash').textContent = bnFmtUSD(data.balance.cash);

  let pl = 0;
  const holdingsHtml = [];
  const allocSegs = [];
  Object.keys(holdings).forEach((cid) => {
    const h = holdings[cid];
    if (!h.qty || h.qty <= 0) return;
    const coin = BN_COINS.find((c) => c.id === cid);
    const value = h.qty * coin.price;
    const costBasis = h.costBasis || 0;
    const gain = value - costBasis;
    pl += gain;
    allocSegs.push({ coin, value });
    holdingsHtml.push(`<div class="holding-row">
      <div class="coin-name"><span class="coin-ic" style="background:${coin.color}">${coin.id.substring(0, 1)}</span>
        <div><div>${coin.name}</div><div style="font-weight:400;color:var(--text-faint);font-size:12px;">${bnFmtQty(h.qty)} ${coin.id}</div></div>
      </div>
      <div style="text-align:right;">
        <div style="font-weight:700;">${bnFmtUSD(value)}</div>
        <div style="font-size:12px;color:${gain >= 0 ? 'var(--green)' : 'var(--red)'};">${gain >= 0 ? '+' : ''}${bnFmtUSD(gain)}</div>
      </div>
    </div>`);
  });
  document.getElementById('p-pl').textContent = (pl >= 0 ? '+' : '') + bnFmtUSD(pl);
  document.getElementById('p-pl').style.color = pl >= 0 ? 'var(--green)' : 'var(--red)';
  document.getElementById('holdingsList').innerHTML = holdingsHtml.join('') || '<div style="text-align:center;color:var(--text-faint);padding:20px;">No crypto holdings yet — try a demo trade!</div>';

  const totalAlloc = allocSegs.reduce((s, a) => s + a.value, 0) || 1;
  document.getElementById('allocBar').innerHTML = allocSegs.map((a) => `<div class="alloc-seg" style="width:${((a.value / totalAlloc) * 100).toFixed(2)}%;background:${a.coin.color};"></div>`).join('');
  document.getElementById('allocLegend').innerHTML = allocSegs.map((a) => `<div><span style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${a.coin.color};margin-right:5px;"></span>${a.coin.id} ${((a.value / totalAlloc) * 100).toFixed(1)}%</div>`).join('') || '<span style="color:var(--text-faint);">No holdings to display</span>';
}
</script>
</body>
</html>
